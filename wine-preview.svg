<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1116;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a2530;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d1520;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5a1f3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a0f28;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7a1f3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a0f28;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="300" height="400" fill="url(#bgGrad)"/>
  
  <!-- Bottle outline -->
  <path d="M 110 80 Q 100 90 100 110 L 100 200 Q 95 220 100 240 L 100 320 Q 100 340 120 350 L 180 350 Q 200 340 200 320 L 200 240 Q 205 220 200 200 L 200 110 Q 200 90 190 80 Z" fill="url(#bottleGrad)" stroke="#c9a227" stroke-width="2"/>
  
  <!-- Wine inside -->
  <path d="M 108 200 Q 105 220 110 240 L 110 330 Q 110 340 125 348 L 175 348 Q 190 340 190 330 L 190 240 Q 195 220 192 200 Z" fill="url(#wineGrad)" opacity="0.8"/>
  
  <!-- Highlight on bottle -->
  <ellipse cx="115" cy="150" rx="8" ry="30" fill="#ffffff" opacity="0.15"/>
  
  <!-- Cork/Cap -->
  <rect x="135" y="60" width="30" height="20" fill="#8a6c1c" rx="2"/>
  <rect x="130" y="55" width="40" height="8" fill="#c9a227" rx="1"/>
  
  <!-- Label -->
  <rect x="110" y="240" width="80" height="50" fill="#f2e9dc" opacity="0.9" rx="2"/>
  <text x="150" y="260" font-family="serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#7a1f3d">Vinho</text>
  <text x="150" y="280" font-family="serif" font-size="12" text-anchor="middle" fill="#7a1f3d">Verde</text>
</svg>